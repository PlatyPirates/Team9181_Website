<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mascotTitle">
  <title id="mascotTitle">Platy Pirates mascot: a pirate platypus wearing an eyepatch and captain's hat</title>
  <defs>
    <style>
      .body-fill { fill: #6B1E2A; }
      .body-shade { fill: #3F0F1A; }
      .bill-fill { fill: #C9A24B; }
      .bill-shade { fill: #A9853A; }
      .ink { fill: #221D1B; }
      .cream { fill: #F1E6CF; }
      .grey { fill: #8C8478; }
    </style>
    <clipPath id="headClip"><ellipse cx="200" cy="178" rx="86" ry="72"/></clipPath>
  </defs>

  <!-- everything is centered on x = 200 -->

  <!-- tail (peeks out behind the body on the right) -->
  <path class="body-fill" d="M292 305 C340 302 352 262 324 246 C292 232 272 266 286 292 C289 301 290 305 292 305 Z"/>
  <path class="body-shade" d="M300 296 C326 290 334 270 322 258 C316 270 308 284 300 296 Z"/>

  <!-- body -->
  <ellipse class="body-fill" cx="200" cy="290" rx="104" ry="72"/>
  <path class="body-shade" d="M120 325 C160 352 240 352 280 325 C250 342 150 342 120 325 Z"/>
  <!-- belly -->
  <ellipse class="cream" cx="200" cy="300" rx="56" ry="38" opacity="0.35"/>

  <!-- feet -->
  <ellipse class="bill-fill" cx="152" cy="354" rx="26" ry="13"/>
  <ellipse class="bill-fill" cx="248" cy="354" rx="26" ry="13"/>

  <!-- head -->
  <ellipse class="body-fill" cx="200" cy="178" rx="86" ry="72"/>

  <!-- eyepatch strap (clipped to the head so it ends at the edge) -->
  <g clip-path="url(#headClip)">
    <path class="ink" d="M108 192 L 292 126 L 292 138 L 108 204 Z"/>
  </g>

  <!-- eyepatch -->
  <ellipse class="ink" cx="162" cy="172" rx="17" ry="20" transform="rotate(-14 162 172)"/>

  <!-- good eye -->
  <circle class="ink" cx="238" cy="170" r="10"/>
  <circle class="cream" cx="241" cy="166" r="3"/>

  <!-- bill, centered under the eyes -->
  <path class="bill-fill" d="M146 208 C146 196 254 196 254 208 C268 230 254 256 200 258 C146 256 132 230 146 208 Z"/>
  <path class="bill-shade" d="M150 236 C170 250 230 250 250 236 C240 254 160 254 150 236 Z"/>
  <circle class="ink" cx="182" cy="214" r="3.5"/>
  <circle class="ink" cx="218" cy="214" r="3.5"/>

  <!-- captain's hat, same width as the head and centered on it -->
  <path class="ink" d="M108 134 C138 62 262 62 292 134 C252 150 148 150 108 134 Z"/>
  <path class="grey" d="M112 130 C150 143 250 143 288 130 L 289 140 C250 154 150 154 111 140 Z"/>
  <circle class="bill-fill" cx="200" cy="96" r="10"/>
</svg>
