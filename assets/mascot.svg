<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -25 400 400" role="img" aria-labelledby="t">
  <title id="t">Platy Pirates mascot: a cute platypus with an eyepatch over two crossed wrenches</title>
  <defs>
    <!-- one wrench, drawn horizontally: ring end left, open end right -->
    <g id="wrench" stroke="#2b0a12" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" fill="#b3a5ae">
      <rect x="-112" y="-11" width="224" height="22" rx="9"/>
      <path fill-rule="evenodd" d="M-160 0 a30 30 0 1 0 60 0 a30 30 0 1 0 -60 0 Z M-141 0 a11 11 0 1 0 22 0 a11 11 0 1 0 -22 0 Z"/>
      <path d="M157.9 -12 L118 -12 L118 12 L157.9 12 A31 31 0 1 1 157.9 -12 Z"/>
      <path d="M-90 -2 L80 -2" stroke="#ece3e8" stroke-width="4" fill="none"/>
    </g>
    <clipPath id="headClip"><ellipse cx="200" cy="138" rx="100" ry="85"/></clipPath>
  </defs>

  <!-- crossed wrenches -->
  <g transform="translate(200 228) rotate(-25) scale(1.15)"><use href="#wrench"/></g>
  <g transform="translate(200 228) rotate(25) scale(-1.15 1.15)"><use href="#wrench"/></g>

  <!-- head -->
  <ellipse cx="200" cy="138" rx="100" ry="85" fill="#93463a" stroke="#2b0a12" stroke-width="8"/>
  <ellipse cx="160" cy="80" rx="34" ry="12" fill="#b2604f" opacity=".75" transform="rotate(-14 160 80)"/>
  <path d="M196 56 Q188 38 202 34 M210 56 Q218 42 230 44" stroke="#2b0a12" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- eyepatch strap -->
  <g clip-path="url(#headClip)">
    <path d="M96 150 L150 126 L310 66" stroke="#1d0a0f" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>

  <!-- cheeks -->
  <ellipse cx="112" cy="170" rx="14" ry="9" fill="#e0766c" opacity=".6"/>
  <ellipse cx="288" cy="170" rx="14" ry="9" fill="#e0766c" opacity=".6"/>

  <!-- flat gold duck-style bill -->
  <path d="M130 172 C130 156 270 156 270 172 C282 196 268 222 200 224 C132 222 118 196 130 172 Z"
        fill="#e2b75a" stroke="#2b0a12" stroke-width="7" stroke-linejoin="round"/>
  <path d="M146 170 Q200 160 254 170" stroke="#f5dc9a" stroke-width="7" fill="none" stroke-linecap="round"/>
  <ellipse cx="176" cy="178" rx="5" ry="4" fill="#2b0a12"/>
  <ellipse cx="224" cy="178" rx="5" ry="4" fill="#2b0a12"/>
  <path d="M186 204 Q200 213 214 204" stroke="#2b0a12" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- eyepatch -->
  <ellipse cx="148" cy="122" rx="28" ry="25" fill="#1d0a0f" stroke="#2b0a12" stroke-width="5" transform="rotate(-18 148 122)"/>
  <ellipse cx="138" cy="112" rx="8" ry="4" fill="#4a3a40" transform="rotate(-30 138 112)"/>

  <!-- big sparkly eye -->
  <circle cx="252" cy="120" r="21" fill="#fff" stroke="#2b0a12" stroke-width="5"/>
  <circle cx="255" cy="123" r="14" fill="#1d0a0f"/>
  <circle cx="260" cy="116" r="5.5" fill="#fff"/>
  <circle cx="250" cy="129" r="2.5" fill="#fff"/>
</svg>
